services:
  postgres:
    image: postgres:16-alpine
    container_name: auction_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-parth grey1}
      POSTGRES_DB: ${DB_NAME:-ecom_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecom_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: auction_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: "production"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-ecom_db}"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-parth grey1}"
      JWT_SECRET: "prod-secret-change-in-real-deployment-32-bytes"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://127.0.0.1"
      SHIPPING_FLAT_RATE: "500"
      BUYERS_PREMIUM_PCT: "10"
      KHALTI_SECRET_KEY: "${KHALTI_SECRET_KEY:-f71c9259c8f6457990893885d591abc7}"
      KHALTI_PUBLIC_KEY: "${KHALTI_PUBLIC_KEY:-bf89cb854d474508bf73337f6c273d88}"
      KHALTI_BASE_URL: "${KHALTI_BASE_URL:-https://a.khalti.com/api/v2}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: auction_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: "/api/v1"
      VITE_WS_URL: ""

volumes:
  postgres_data:
  backend_uploads:
